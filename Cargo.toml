[package]
name = "craboard"
version = "0.1.0"
edition = "2024"
description = "Craboard"

[dependencies]
# wgpu 在本机 DX12 下面板合成有问题，继续用 glow；窗口不透明，合成开销更低
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard"] }
winit = "0.30.13"
egui = "0.37.0"
tray-icon = "0.26.1"
global-hotkey = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
